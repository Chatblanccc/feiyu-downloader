name: Android CI
on:
  pull_request:
    paths: ['AndroidDownloader/**', '.github/workflows/android-ci.yml']
  push:
    branches: [main]
    paths: ['AndroidDownloader/**', '.github/workflows/android-ci.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  android:
    name: Android build, unit tests and lint
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install SDK
        run: sdkmanager "platforms;android-37" "build-tools;37.0.0"
      - name: Offline acceptance receipt tests
        run: python3 -m unittest discover -s AndroidDownloader/scripts -p 'test_*.py' -v
      - name: Build source and run checks
        working-directory: AndroidDownloader
        run: ./gradlew testDebugUnitTest assembleDebug lintDebug --console=plain
