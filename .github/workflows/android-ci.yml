name: Android CI
on:
  pull_request:
    paths: ['AndroidDownloader/**', '.github/workflows/android-ci.yml']
  push:
    branches: [main]
    paths: ['AndroidDownloader/**', '.github/workflows/android-ci.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  android:
    name: Android build, unit tests and lint
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Select JDK 21 and install SDK
        run: |
          echo "JAVA_HOME=$JAVA_HOME_21_X64" >> "$GITHUB_ENV"
          echo "$JAVA_HOME_21_X64/bin" >> "$GITHUB_PATH"
          sdkmanager "platforms;android-37" "build-tools;37.0.0"
      - name: Offline acceptance receipt tests
        run: python3 -m unittest discover -s AndroidDownloader/scripts -p 'test_*.py' -v
      - name: Build source and run checks
        working-directory: AndroidDownloader
        run: ./gradlew testDebugUnitTest assembleDebug lintDebug --console=plain
